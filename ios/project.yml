# XcodeGen spec: `xcodegen generate` turns this into Expensiarmus.xcodeproj (not committed).
name: Expensiarmus
options:
  bundleIdPrefix: com.csymvoul
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Expensiarmus:
    type: application
    platform: iOS
    sources:
      - path: Expensiarmus
      # The web app, bundled as a folder so its files keep their paths.
      - path: ../web
        type: folder
        buildPhase: resources
    info:
      path: Expensiarmus/Info.plist
      properties:
        CFBundleDisplayName: Expensiarmus
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.csymvoul.expensiarmus
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  ExpensiarmusTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ExpensiarmusTests
    dependencies:
      - target: Expensiarmus
schemes:
  Expensiarmus:
    build:
      targets:
        Expensiarmus: all
    test:
      targets:
        - ExpensiarmusTests
