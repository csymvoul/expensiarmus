# XcodeGen spec: `xcodegen generate` turns this into Expensiarmus.xcodeproj (not committed).
name: Expensiarmus
options:
  bundleIdPrefix: com.csymvoul
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "1.19.0"
    CURRENT_PROJECT_VERSION: "36"
    SWIFT_VERSION: "5.0"
targets:
  Expensiarmus:
    type: application
    platform: iOS
    sources:
      - path: Expensiarmus
      - path: Shared
      # The web app, bundled as a folder so its files keep their paths.
      - path: ../web
        type: folder
        buildPhase: resources
    info:
      path: Expensiarmus/Info.plist
      properties:
        CFBundleDisplayName: Expensiarmus
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        # Lets the home-screen widget open the app at a screen.
        CFBundleURLTypes:
          - CFBundleURLName: com.csymvoul.expensiarmus
            CFBundleURLSchemes: [expensiarmus]
    entitlements:
      path: Expensiarmus/Expensiarmus.entitlements
      properties:
        com.apple.security.application-groups: [group.com.csymvoul.expensiarmus]
    dependencies:
      - target: ExpensiarmusWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.csymvoul.expensiarmus
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  ExpensiarmusWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ExpensiarmusWidget
      - path: Shared
    info:
      path: ExpensiarmusWidget/Info.plist
      properties:
        CFBundleDisplayName: Expensiarmus
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ExpensiarmusWidget/ExpensiarmusWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.csymvoul.expensiarmus]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.csymvoul.expensiarmus.widget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  ExpensiarmusTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ExpensiarmusTests
    dependencies:
      - target: Expensiarmus
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Expensiarmus:
    build:
      targets:
        Expensiarmus: all
    test:
      targets:
        - ExpensiarmusTests
